{
  "mixed-port": 17890,
  "allow-lan": false,
  "bind-address": "127.0.0.1",
  "mode": "rule",
  "log-level": "silent",
  "ipv6": false,
  "proxies": [
    {
      "name": "node",
      "type": "vless",
      "server": "node.example.com",
      "port": 10443,
      "udp": true,
      "uuid": "00000000-0000-4000-8000-000000000001",
      "tls": true,
      "network": "xhttp",
      "servername": "node.example.com",
      "client-fingerprint": "chrome",
      "xhttp-opts": {
        "path": "/proxy-xhttp",
        "mode": "packet-up"
      },
      "skip-cert-verify": false
    }
  ],
  "rules": [
    "MATCH,node"
  ]
}
