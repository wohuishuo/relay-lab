<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title description">
  <title id="title">RelayLab</title>
  <desc id="description">Personal proxy infrastructure. Build it, understand it, verify it. TCP, QUIC and HTTP transports connect a client to one Mihomo core and then to the Internet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1221"/>
      <stop offset="1" stop-color="#152c43"/>
    </linearGradient>
    <linearGradient id="connection" gradientUnits="userSpaceOnUse" x1="794" y1="201" x2="1382" y2="201">
      <stop stop-color="#5fd5c2"/>
      <stop offset="1" stop-color="#75b8ee"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a0c8de" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1440" height="400" rx="24" fill="url(#background)"/>
  <rect width="1440" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="52" width="314" height="30" rx="15" fill="#173b3d"/>
    <text x="83" y="72" fill="#85e0cc" font-size="12" font-weight="600" letter-spacing="1.3">PERSONAL PROXY INFRASTRUCTURE</text>
    <text x="64" y="183" fill="#f0f6fc" font-size="88" font-weight="700" letter-spacing="-3">RelayLab</text>
    <text x="68" y="236" fill="#c5d7e7" font-size="26">Build it. Understand it. Verify it.</text>
    <path d="M69 280H628" stroke="#435e74" stroke-opacity=".7"/>
    <text x="69" y="315" fill="#a4bed2" font-size="12" font-weight="600" letter-spacing="1.5">ONE CORE</text>
    <circle cx="179" cy="310" r="2" fill="#5fd5c2"/>
    <text x="199" y="315" fill="#a4bed2" font-size="12" font-weight="600" letter-spacing="1.5">MULTIPLE TRANSPORTS</text>
    <circle cx="393" cy="310" r="2" fill="#5fd5c2"/>
    <text x="413" y="315" fill="#a4bed2" font-size="12" font-weight="600" letter-spacing="1.5">REPRODUCIBLE CHECKS</text>
    <g stroke="url(#connection)" stroke-width="2" fill="none" opacity=".85">
      <path d="M926 121H974Q996 121 996 143V190H1038"/>
      <path d="M926 201H1038"/>
      <path d="M926 281H974Q996 281 996 259V212H1038"/>
      <path d="M1208 201H1270"/>
    </g>
    <g fill="#162b3d" stroke="#385d74">
      <rect x="794" y="92" width="132" height="58" rx="12"/>
      <rect x="794" y="172" width="132" height="58" rx="12"/>
      <rect x="794" y="252" width="132" height="58" rx="12"/>
    </g>
    <g fill="#c9e7f0" font-size="19" font-weight="600" text-anchor="middle">
      <text x="860" y="128">TCP</text>
      <text x="860" y="208">QUIC</text>
      <text x="860" y="288">HTTP</text>
    </g>
    <rect x="1038" y="143" width="170" height="116" rx="18" fill="#163f49" stroke="#61caba" stroke-width="1.5"/>
    <text x="1123" y="197" fill="#e0fff5" font-size="26" font-weight="600" text-anchor="middle">Mihomo</text>
    <text x="1123" y="226" fill="#91c8c4" font-size="14" text-anchor="middle">ONE CORE</text>
    <rect x="1270" y="172" width="112" height="58" rx="12" fill="#1a3045" stroke="#467997"/>
    <text x="1326" y="208" fill="#c9e7f0" font-size="17" font-weight="600" text-anchor="middle">Internet</text>
    <circle cx="1038" cy="201" r="4" fill="#79ddcc"/>
    <circle cx="1208" cy="201" r="4" fill="#75b8ee"/>
    <text x="1090" y="353" fill="#7f9eb4" font-size="11" letter-spacing="1.1" text-anchor="middle">CLIENT → TRANSPORT → NODE → DESTINATION</text>
  </g>
</svg>
